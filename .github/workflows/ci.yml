name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docs:
    name: Validate Documentation & Relative Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Document Integrity & Relative Links
        run: node scripts/validate-links.cjs

      - name: Validate Shell Scripts
        run: bash -n scripts/deploy-testnet.sh
